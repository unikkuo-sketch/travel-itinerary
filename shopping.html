<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物建議｜宇宙碎片集散地</title>
    <meta name="description" content="在地購物建議與本機清單工具——宇宙碎片集散地">
    <meta property="og:title" content="購物建議｜宇宙碎片集散地">
    <meta property="og:description" content="在地特產參考清單；勾選狀態僅存於你的裝置">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://universum-sliver.vercel.app/shopping.html">
    <meta property="og:image" content="https://universum-sliver.vercel.app/images/hub-hero.webp">
    <meta property="og:site_name" content="宇宙碎片集散地">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="購物建議｜宇宙碎片集散地">
    <meta name="twitter:description" content="在地特產參考清單；勾選狀態僅存於你的裝置">
    <meta name="twitter:image" content="https://universum-sliver.vercel.app/images/hub-hero.webp">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="hero hero-shopping">
        <div class="hero-content">
            <span class="hero-badge">Shopping List</span>
            <h1 id="shopping-trip-title">購物採購清單</h1>
            <p class="hero-subtitle">參考推薦、建立自己的採購清單</p>
        </div>
    </header>

    <main class="main-content">
        <section id="shopping-zone-mine" class="section shopping-zone shopping-zone--mine">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">My List</span>
                <h2>我的待買清單</h2>
                <p>訪客可自用：自行輸入或從下方建議加入 · 自動儲存於此裝置（不上傳）</p>
            </div>
            <div class="shopping-container">
                <div class="input-group">
                    <input type="text" id="itemInput" class="shopping-input" placeholder="輸入想買的東西...">
                    <button id="addBtn" class="btn-add">加入</button>
                </div>
                <ul id="shoppingList" class="shopping-list"></ul>
            </div>
        </section>

        <section class="section shopping-zone shopping-zone--trip">
            <p class="shopping-price-disclaimer">在地建議參考 · 非即時報價</p>
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Souvenirs</span>
                <h2>在地特產建議</h2>
            </div>
            <div id="shopping-rec-root" class="shopping-trip-root"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-wish">The quiet thrill of spending well.</p>
            <p class="footer-date">照片授權見 <a class="footer-link" href="https://github.com/unikkuo-sketch/travel-itinerary/blob/main/ATTRIBUTIONS.md">素材與授權</a></p>
        </div>
    </footer>

    <script type="module" src="/js/shopping.js"></script>
</body>
</html>
