# GitHub Pages relocating stub — DISABLED
#
# Old github.io site is closed. Do not re-enable full-site or stub Pages
# deploys (avoids dual canonical / failed Pages builds).
#
# Kept for history; trigger only via workflow_dispatch if ever needed.

name: Relocate GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relocate:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./relocating
          force_orphan: true
