<body>
    <header id="hero-root" class="hero"></header>

    <nav class="nav-sticky">
        <div class="nav-shell">
            <div id="nav-container" class="nav-row nav-row--sections"></div>
            <div id="nav-days" class="nav-row nav-row--days" hidden></div>
        </div>
    </nav>

    <main class="main-content">
        <section id="overview" class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Overview</span>
                <h2>行程總覽</h2>
            </div>
            <div class="overview-table-wrapper">
                <table class="overview-table">
                    <thead>
                        <tr>
                            <th>天數</th>
                            <th>日期</th>
                            <th>主要地點</th>
                            <th>住宿</th>
                            <th>交通重點</th>
                        </tr>
                    </thead>
                    <tbody id="overview-body"></tbody>
                </table>
            </div>
        </section>

        <section id="highlights" class="section" hidden>
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Highlights</span>
                <h2>行程亮點</h2>
            </div>
            <div id="highlights-root" class="highlight-grid"></div>
        </section>

        <section id="tickets" class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Tickets</span>
                <h2>票券搭配</h2>
            </div>
            <div id="ticket-grid" class="ticket-grid"></div>
        </section>

        <section id="lodging" class="section" hidden>
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Stay</span>
                <h2>精選住宿</h2>
            </div>
            <div id="lodging-root" class="lodging-grid"></div>
        </section>

        <section id="route-map" class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Route</span>
                <h2>本次旅程路線</h2>
            </div>
            <div id="route-strip" class="route-strip" aria-label="八日動線摘要"></div>
            <div id="leaflet-map" class="leaflet-map"></div>
            <div id="map-legend" class="map-legend" aria-label="分日路線圖例"></div>
        </section>

        <div id="days-root"></div>

        <section id="budget" class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Budget</span>
                <h2>預算總覽</h2>
            </div>
            <div id="budget-root"></div>
        </section>

        <section class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Season</span>
                <h2>季節特色活動</h2>
            </div>
            <div id="events-root" class="events-grid"></div>
        </section>

        <section id="weather" class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Weather</span>
                <h2>氣候與穿著建議</h2>
            </div>
            <div id="weather-root" class="weather-grid"></div>
        </section>

        <section class="section">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Apps</span>
                <h2>實用 APP 推薦</h2>
            </div>
            <div class="apps-grid">
                <div class="app-item" data-icon="map"><span class="app-icon"></span><span class="app-name">Google Maps</span><span class="app-desc">導航必備</span></div>
                <div class="app-item" data-icon="train"><span class="app-icon"></span><span class="app-name">換乘案內</span><span class="app-desc">查詢電車時刻</span></div>
                <div class="app-item" data-icon="food"><span class="app-icon"></span><span class="app-name">Tabelog</span><span class="app-desc">餐廳評價</span></div>
                <div class="app-item" data-icon="translate"><span class="app-icon"></span><span class="app-name">Google 翻譯</span><span class="app-desc">即時翻譯</span></div>
                <div class="app-item" data-icon="weather"><span class="app-icon"></span><span class="app-name">tenki.jp</span><span class="app-desc">天氣預報</span></div>
            </div>
        </section>

        <!-- Japan-only sister aside: manhole cards by prefecture (not in sticky nav) -->
        <section id="manhole-aside" class="section section--manhole-aside" hidden>
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Aside</span>
                <h2>路途上的水溝蓋</h2>
                <p>順路領當地特色水溝蓋卡片</p>
            </div>
            <div id="manhole-aside-root" class="manhole-aside"></div>
        </section>

    </main>

    <footer class="footer">
        <div id="footer-root" class="footer-content"></div>
        <div class="footer-content footer-content--site">
            <p class="footer-date">照片授權見 <a class="footer-link" href="https://github.com/unikkuo-sketch/travel-itinerary/blob/main/ATTRIBUTIONS.md">素材與授權</a></p>
            <p class="footer-date footer-sister" id="footer-manhole" hidden>平行宇宙 · <a class="footer-link" href="https://manholecard.vercel.app/" target="_blank" rel="noopener noreferrer">マンホールカード收集</a></p>
        </div>
    </footer>
