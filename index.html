<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙碎片集散地</title>
    <meta name="description" content="個人旅遊行程總覽">
    <meta property="og:title" content="宇宙碎片集散地">
    <meta property="og:description" content="收集每一次啟程的碎片，拼成屬於我們的旅行地圖">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://unikkuo-sketch.github.io/travel-itinerary/">
    <meta property="og:image" content="https://unikkuo-sketch.github.io/travel-itinerary/images/hub-hero.webp">
    <meta property="og:site_name" content="宇宙碎片集散地">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="宇宙碎片集散地">
    <meta name="twitter:description" content="收集每一次啟程的碎片，拼成屬於我們的旅行地圖">
    <meta name="twitter:image" content="https://unikkuo-sketch.github.io/travel-itinerary/images/hub-hero.webp">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="hero hero-hub hero-photo">
        <figure class="ph ph--hero">
            <img class="ph-img" src="/images/hub-hero.webp" alt="河津川沿岸盛開的河津櫻與駛過的列車" fetchpriority="high" loading="eager" decoding="async" onload="this.closest('.ph').classList.add('ph--loaded')" onerror="this.closest('.ph').classList.add('ph--error')">
            <span class="ph-credit ph-credit--hero">9689tatsuya / CC BY 4.0</span>
        </figure>
        <div class="hero-photo-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">Travel Hub</span>
            <h1>宇宙碎片集散地</h1>
            <p class="hero-subtitle">收集每一次啟程的碎片，拼成屬於我們的旅行地圖</p>
            <div class="hero-cta-group">
                <a href="#hub-grid" class="btn-hero">探索所有行程</a>
                <a href="#featured" class="btn-hero btn-hero--ghost">目的地地圖</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section section-welcome reveal">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">About</span>
                <h2>關於這個集散地</h2>
            </div>
            <p class="welcome-blurb">收藏每一塊旅行碎片——航班、住宿、路線、預算與當地特產清單。</p>
        </section>

        <section class="section reveal">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Itineraries</span>
                <h2>所有行程</h2>
                <p>依時間排序，規劃與回顧都在這裡</p>
            </div>
            <div id="hub-grid" class="hub-grid"></div>
        </section>

        <section class="section reveal" id="featured">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Map</span>
                <h2>目的地地圖</h2>
                <p>在地圖上點選目的地</p>
            </div>
            <div id="featured-map" class="featured-map"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-wish">Every journey, a fragment of the infinite.</p>
            <p class="footer-date">照片授權見 <a class="footer-link" href="https://github.com/unikkuo-sketch/travel-itinerary/blob/main/ATTRIBUTIONS.md">素材與授權</a></p>
        </div>
    </footer>

    <script type="module" src="/js/hub.js"></script>
</body>
</html>
