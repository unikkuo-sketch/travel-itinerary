<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙碎片集散地</title>
    <meta name="description" content="真實走過的日本行程與風土筆記——給同樣在排行程的人當參考。">
    <meta property="og:title" content="宇宙碎片集散地">
    <meta property="og:description" content="真實走過的日本行程與風土筆記——給同樣在排行程的人當參考。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://universum-sliver.vercel.app/">
    <meta property="og:image" content="https://universum-sliver.vercel.app/images/hub-hero.webp">
    <meta property="og:site_name" content="宇宙碎片集散地">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="宇宙碎片集散地">
    <meta name="twitter:description" content="真實走過的日本行程與風土筆記——給同樣在排行程的人當參考。">
    <meta name="twitter:image" content="https://universum-sliver.vercel.app/images/hub-hero.webp">
    <link rel="canonical" href="https://universum-sliver.vercel.app/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="hero hero-hub hero-photo">
        <figure class="ph ph--hero">
            <img class="ph-img" src="/images/hub-hero.webp" alt="河津川沿岸盛開的河津櫻與駛過的列車" fetchpriority="high" loading="eager" decoding="async" onload="this.closest('.ph').classList.add('ph--loaded')" onerror="this.closest('.ph').classList.add('ph--error')">
            <span class="ph-credit ph-credit--hero">9689tatsuya / CC BY 4.0</span>
        </figure>
        <div class="hero-photo-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">Travel Hub</span>
            <h1>宇宙碎片集散地</h1>
            <p class="hero-subtitle">宇宙塵埃漂泊足跡，真實滾過的旅遊筆記</p>
            <div class="hero-cta-group">
                <a href="#hub-grid" class="btn-hero">探索行程</a>
                <a href="#featured" class="btn-hero btn-hero--ghost">目的地地圖</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="section section-welcome reveal">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">About</span>
                <h2>關於這個集散地</h2>
            </div>
            <p class="welcome-blurb">旅遊碎片：每日行程路線、景點、飲食、土產</p>
            <div id="welcome-grid" class="welcome-grid" aria-label="集散地內容"></div>
        </section>

        <section class="section reveal" id="hub-grid">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Itineraries</span>
                <h2>碎片寶箱</h2>
                <p>即將出發與旅程回顧</p>
            </div>
            <div id="hub-upcoming-wrap" class="hub-group" hidden>
                <h3 class="hub-group-title">即將出發</h3>
                <div id="hub-upcoming" class="hub-grid"></div>
            </div>
            <div id="hub-past-wrap" class="hub-group" hidden>
                <h3 class="hub-group-title">旅程回顧</h3>
                <div id="hub-past" class="hub-grid"></div>
            </div>
            <p id="hub-empty" class="hub-empty" hidden>尚無行程。</p>
        </section>

        <section class="section reveal" id="featured">
            <div class="section-header section-header--editorial">
                <span class="section-eyebrow">Map</span>
                <h2>碎片漂泊地</h2>
                <p>在地圖上點選目的地，進入該趟行程</p>
            </div>
            <div id="featured-map" class="featured-map"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-wish">Every journey, a fragment of the infinite.</p>
            <p class="footer-date">照片授權見 <a class="footer-link" href="https://github.com/unikkuo-sketch/travel-itinerary/blob/main/ATTRIBUTIONS.md">素材與授權</a></p>
        </div>
    </footer>

    <script type="module" src="/js/hub.js"></script>
</body>
</html>
